# Free deploy for Bulkyy
# Backend: Render free web service
# Database: Render free Postgres OR Neon free
# Frontend: deploy separately on Vercel (see DEPLOY.md)

services:
  - type: web
    name: bulkyy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bulkyy-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DEFAULT_DAILY_LIMIT
        value: "15"
      - key: SEND_DELAYS
        value: "30,60,90,120"

databases:
  - name: bulkyy-db
    plan: free
    databaseName: bulkyy
    user: bulkyy
